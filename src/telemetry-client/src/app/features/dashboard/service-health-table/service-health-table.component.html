@if (rows().length === 0) {
  <app-empty-state icon="dns" message="No services in this window" />
} @else {
  <table mat-table [dataSource]="rows()" matSort
         [matSortActive]="sortState().col" [matSortDirection]="sortState().dir"
         (matSortChange)="onSort($event)" class="full-width health-table">
    <ng-container matColumnDef="service">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Service</th>
      <td mat-cell *matCellDef="let r">{{ r.service }}</td>
    </ng-container>
    <ng-container matColumnDef="count">
      <th mat-header-cell *matHeaderCellDef mat-sort-header class="num" arrowPosition="before">Traces</th>
      <td mat-cell *matCellDef="let r" class="num">{{ r.count | number }}</td>
    </ng-container>
    <ng-container matColumnDef="rate">
      <th mat-header-cell *matHeaderCellDef mat-sort-header matTooltip="Traces per second" class="num" arrowPosition="before">Rate/s</th>
      <td mat-cell *matCellDef="let r" class="num">{{ r.ratePerSecond | number: '1.0-2' }}</td>
    </ng-container>
    <ng-container matColumnDef="errorRate">
      <th mat-header-cell *matHeaderCellDef mat-sort-header class="num" arrowPosition="before">Err %</th>
      <td mat-cell *matCellDef="let r" class="num" [style.color]="r.errorRate > 0 ? '#f44336' : ''">
        {{ r.errorRate | number: '1.0-1' }}%
      </td>
    </ng-container>
    <ng-container matColumnDef="avg">
      <th mat-header-cell *matHeaderCellDef mat-sort-header class="num" arrowPosition="before">Avg</th>
      <td mat-cell *matCellDef="let r" class="num">{{ formatDuration(r.avgMs) }}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"
        class="clickable-row"
        [class.active-row]="row.service === activeService"
        [matTooltip]="row.service === activeService ? 'Click to clear the service filter' : 'Click to filter the dashboard to this service'"
        (click)="rowClick.emit(row.service)"></tr>
  </table>
}
